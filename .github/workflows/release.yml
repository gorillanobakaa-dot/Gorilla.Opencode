name: release

# GORILLA OVERRIDE (2026-10-05): started by hand only.
#
# This is the upstream project's goreleaser job. It ran on every tag and failed
# on every tag ("missing GITHUB_TOKEN, GITLAB_TOKEN and GITEA_TOKEN"), because
# Gorilla OpenCode is not released by goreleaser: the files are built, tested
# against a real model and published by hand, and then installed on real Linux
# by linux-install.yml. A check that is red on every release teaches everyone to
# ignore red, which is how the Linux test run went unread for four releases.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true
          cache-dependency-path: go.sum

      - run: go mod download

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
