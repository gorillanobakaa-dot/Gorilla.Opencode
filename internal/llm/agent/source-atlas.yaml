# What the source atlas shows the research helpers, and in what order: the sections, the sources picked for each,
# and one line of advice per source. The grade, the reach and the address of every source come from
# docs/source-registry.json, never from here. cmd/atlas renders source-atlas.txt from the two; a test fails
# when the committed atlas is not what it renders. Edit this file or the registry, then:
#     go run ./cmd/atlas > internal/llm/agent/source-atlas.txt
# source: names the registry entry when the atlas shows a different name.
header: |
  SOURCE ATLAS — free research sources by domain, strongest first.
  Reach: API = keyless HTTP API (web_fetch the endpoint). API-key = free after registration —
  say so if unavailable. SearXNG = web_search engine bang (e.g. !crossref, !openalex, !pubmed,
  !arxiv, "!google scholar"). SearXNG* = installed but off; note it for the user. Grade A/B is
  the source-reliability PRIOR; claims are still graded independently at vetting.
  This is the starting map, not the boundary: a source that is not listed here is still
  fair game if web_search or web_fetch can reach it. This list is all you have been given.
sections:
- title: Scholarly & scientific literature
  entries:
  - name: OpenAlex
  - name: Crossref
  - name: arXiv
    advice: |-
      physics, maths, CS, quantitative biology;
      full text free. The first place to look for anything computational or theoretical.
  - name: bioRxiv / medRxiv
    source: bioRxiv
    advice: |-
      preprints, unreviewed BY DEFINITION: grade
      the source accordingly and say it is a preprint in the finding.
  - name: PsyArXiv
  - name: Semantic Scholar
  - name: Google Scholar
