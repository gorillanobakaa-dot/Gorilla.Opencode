# fieldkit mutate --plan tests/mutations-model-awareness.yaml --cwd . -- go test -count=1 ./internal/hostprobe/ ./internal/howto/ ./internal/llm/prompt/ ./internal/llm/agent/ ./internal/llm/tools/ -run "(?i)(carriestheprobe|windowslines|linuxlines|shelledition|getiscached|windows11|msvc|powertoys|card|robocopy|carriesthetooltable|osgated|renderedsystem|howto|chaining|nameStheedition|tooltablelines)"
# Job 06 of goal windows-capabilities (2026-10-27): the model knows its tools and its machine. Every rule added,
# broken on purpose; each must be CAUGHT. Run on Windows (the probe's registry reads and the PowerShell rules are
# Windows facts).
# Not in the plan, on purpose: the sync.Once cache (a second probe gives the same lines on an unchanged machine, so
# no test can tell), the "also installed" filter (the test string is a prefix either way), and the Linux /etc/os-release
# reader (this plan runs on Windows; the Linux CI runs TestLinuxLinesCarryNoWindowsFacts on synthetic facts).

# --- the probe's lines
- file: internal/hostprobe/hostprobe.go
  swap: ['cpu += fmt.Sprintf("; robocopy /MT:n takes 1-%d threads (default 8), the files tool drives it", RobocopyMaxThreads)', 'cpu += ""']
  why: the CPU line stops saying robocopy's thread limit
- file: internal/hostprobe/hostprobe.go
  swap: ['const RobocopyMaxThreads = 128', 'const RobocopyMaxThreads = 64']
  why: the model is told a wrong /MT limit
- file: internal/hostprobe/hostprobe.go
  swap: ['	if f.PowerToys != "" {', '	if true {']
  why: PowerToys is taught although it is not installed
- file: internal/hostprobe/hostprobe.go
  swap: ['	if len(f.Sysinternals) > 0 {', '	if true {']
  why: Sysinternals is named although none is on PATH
- file: internal/hostprobe/hostprobe.go
  swap: ['case strings.Contains(base, "pwsh"):', 'case false:']
  why: PowerShell 7 is not told apart from other shells
- file: internal/hostprobe/hostprobe.go
  swap: ['CPUs: runtime.NumCPU()}', 'CPUs: 8}']
  why: the CPU count is not this machine's

