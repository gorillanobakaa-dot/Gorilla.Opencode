# fieldkit mutate --plan tests/mutations-claim-guard.yaml --cwd . -- go test ./internal/app/ ./internal/acp/ ./internal/tui/components/chat/ -count=1 -run "Claim|Honest|Turn|DeepSeek|Shape|Screen|OnlyTheMessage|WarningLine"
# Every rule of the claim guard (internal/app/claimguard.go, 2026-10-25), broken on purpose; each must be CAUGHT.
- file: internal/app/claimguard.go
  swap: ["if strings.HasSuffix(sentence, \"?\") {", "if false && strings.HasSuffix(sentence, \"?\") {"]
  why: a question counts as a claim again
- file: internal/app/claimguard.go
  swap: ["if blocked(words, i) {", "if false && blocked(words, i) {"]
  why: a negation, modal or condition no longer stops a claim
- file: internal/app/claimguard.go
  swap: ["const claimWindow = 4", "const claimWindow = 1"]
  why: a blocker two or more words before the verb is missed ("if the files were deleted")
- file: internal/app/claimguard.go
  swap: ["text = fencedCodeRe.ReplaceAllString(text, \"\\n\")", "_ = fencedCodeRe"]
  why: words inside a code block count as claims
- file: internal/app/claimguard.go
  swap: ["text = inlineCodeRe.ReplaceAllString(text, \" code \")", "_ = inlineCodeRe"]
  why: '"Executed `del ...`" is no longer seen as a run claim'
- file: internal/app/claimguard.go
  swap: ["if auxOnly[before] {", "if true {"]
  why: the imperative "run" counts as a claim
- file: internal/app/claimguard.go
  swap: ["case claimSubjects[before], claimObjects[after], isNumber(after):", "case claimObjects[after], isNumber(after):"]
  why: '"All files were deleted" / "I deleted" are missed'
- file: internal/app/claimguard.go
  swap: ["case claimSubjects[before], claimObjects[after], isNumber(after):", "case claimSubjects[before], isNumber(after):"]
  why: '"The script erased them" is missed'
- file: internal/app/claimguard.go
  swap: ["case claimSubjects[before], claimObjects[after], isNumber(after):", "case claimSubjects[before], claimObjects[after]:"]
