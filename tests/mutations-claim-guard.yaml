- file: internal/app/claimguard.go
  swap: ["case j < 0 && (i > 0 || after == \"code\" || after == \"\"):", "case j < 0:"]
  why: '"Deleted files go to the Recycle Bin" is flagged'
- file: internal/app/claimguard.go
  swap: ["case j < 0 && (i > 0 || after == \"code\" || after == \"\"):", "case false:"]
  why: a clause that opens with the verb ("Executed ...", "Successfully installed ...") is missed
- file: internal/app/claimguard.go
  swap: ["for j >= 0 && claimAdverbs[words[j]] {", "for false && claimAdverbs[words[j]] {"]
