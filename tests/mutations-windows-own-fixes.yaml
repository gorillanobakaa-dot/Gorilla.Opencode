  why: a UNC URI loses its server name
- file: internal/lsp/protocol/uri.go
  swap: ['filename, err := filename(uri)', 'filename, err := filename(uri); if err != nil { panic(err) }']
  why: a bad URI panics again instead of returning an error
- file: internal/lsp/protocol/uri.go
  swap: ['case hasSlash && host != "" && herr == nil && !isDriveLetter(uhost):', 'case false:']
  why: a server's file://server/share URI is turned into a local path
- file: internal/lsp/protocol/uri.go
  swap: ['if strings.HasPrefix(path, "//") && len(path) > 2 && path[2] != ''/'' {', 'if false {']
  why: a UNC path becomes file:////server instead of file://server
- file: internal/lsp/client.go
  swap: ['URI:  protocol.URI(protocol.URIFromPath(workspaceDir)),', 'URI:  protocol.URI("file://" + workspaceDir),']
  why: the workspace URI is built by hand again (file://C:\x)
- file: internal/lsp/util/edit.go
  swap: ['	path, err := uri.Path()', '	path, err := strings.TrimPrefix(string(uri), "file://"), error(nil)']
  why: a server's edit is applied to the URI text instead of the file
- file: internal/llm/tools/diagnostics.go
  swap: ['return strings.EqualFold(a, b)', 'return a == b']
  why: diagnostics for c:\x.go are not matched to C:\X.go

