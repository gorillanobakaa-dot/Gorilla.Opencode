# fieldkit mutate --plan tests/mutations-trash.yaml --cwd . -- go test ./internal/llm/tools/ -count=1 -run "Trash|Permanent|Recycle|Scratch|HugeDelete|Helper|ToolGuidance"
# Each rule of internal/llm/tools/trash.go (2026-10-25), broken on purpose: every one must be CAUGHT.
